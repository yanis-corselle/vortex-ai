services:
  freellmapi:
    image: ghcr.io/tashfeenahmed/freellmapi:latest
    container_name: freellmapi
    environment:
      - PORT=3001
      - ENCRYPTION_KEY=${FREELLMAPI_ENCRYPTION_KEY}
    ports:
      - "3001:3001"
    volumes:
      - freellmapi_data:/app/server/data
    restart: unless-stopped

  anythingllm:
    image: mintplexlabs/anythingllm:latest
    container_name: anythingllm
    ports:
      - "3000:3001"
    environment:
      - STORAGE_DIR=/app/server/storage
    volumes:
      - anythingllm_storage:/app/server/storage
    restart: unless-stopped

  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    ports:
      - "5678:5678"
    environment:
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      - N8N_SECURE_COOKIE=false
      - WEBHOOK_URL=http://${PI_IP}:5678/
    volumes:
      - n8n_data:/home/node/.n8n
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: evolution-db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres_password
      - POSTGRES_DB=evolution_db
    volumes:
      - db_data:/var/lib/postgresql/data
    restart: unless-stopped

  evolution-api:
    image: evoapicloud/evolution-api:latest
    container_name: evolution-api
    ports:
      - "8080:8080"
    environment:
      - SERVER_URL=http://${PI_IP}:8080
      - API_KEY=${EVOLUTION_API_KEY}
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=${DATABASE_CONNECTION_URI}
      - CACHE_REDIS_ENABLED=false
      - CACHE_LOCAL_ENABLED=true
    depends_on:
      - postgres
    volumes:
      - evolution_instances:/instance
    restart: unless-stopped


volumes:
  freellmapi_data:
  anythingllm_storage:
  n8n_data:
  evolution_instances:
  db_data:

