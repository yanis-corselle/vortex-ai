name: Deploy to Raspberry Pi 5

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create .env from Secrets
        run: |
          cat <<EOF > .env
          PI_HOST="192.168.1.152"
          PI_IP="192.168.1.152"
          PI_USER="yanis"
          PI_PORT="22"
          PI_DIR="~/vortexai"
          COMPOSE_PROJECT_NAME="vortexai"
          TIMEZONE="Europe/Paris"
          EVOLUTION_API_KEY="${{ secrets.EVOLUTION_API_KEY }}"
          EVOLUTION_PORT="8080"
          DATABASE_CONNECTION_URI="postgresql://postgres:postgres_password@postgres:5432/evolution_db?schema=evolution_api"
          N8N_PORT="5678"
          N8N_ENCRYPTION_KEY="${{ secrets.N8N_ENCRYPTION_KEY }}"
          FREELLMAPI_PORT="3001"
          FREELLMAPI_KEY="${{ secrets.FREELLMAPI_KEY }}"
          FREELLMAPI_ENCRYPTION_KEY="${{ secrets.FREELLMAPI_ENCRYPTION_KEY }}"
          ANYTHINGLLM_PORT="3000"
          EOF

      - name: Deploy Docker Stack
        run: |
          docker compose -p vortexai down --volumes --remove-orphans || true
          docker compose -p vortexai up -d --remove-orphans
          docker compose -p vortexai ps

